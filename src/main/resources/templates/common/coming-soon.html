<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle}">준비 중</title>

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/common/coming-soon.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
</head>

<body>

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

      <header class="page-header">
        <h1 th:text="${pageTitle}">준비 중</h1>
      </header>

      <section class="coming-soon">
        <img class="coming-soon-img" th:src="@{/images/coming-soon.png}" alt="준비중입니다" />
        <div class="coming-soon-text">
          <p class="coming-soon-title" th:text="|${pageTitle} 화면은 준비 중입니다.|">화면은 준비 중입니다.</p>
        </div>
      </section>

    </main>
  </div>

</body>

</html>
