<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 문제풀이</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student-common.css}" />
  <link rel="stylesheet" th:href="@{/css/student-question.css}" />
</head>

<body>
  <div class="app-viewport">
    <main class="page" id="questionPage" th:data-student-id="${studentId}" th:data-content-id="${contentId}"
      th:data-qlevel="${qlevel}">
      <header class="topbar">
        <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
        <div class="top-actions">
          <a class="exit-btn" th:href="@{/student/main(studentId=${studentId})}">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>나가기</a>
        </div>
      </header>

      <section class="quiz-wrap">
        <!-- 데이터 없음 안내 -->
        <div class="card state-card" id="emptyState" hidden>
          <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          <p id="emptyStateMsg">추천 도서 정보를 찾을 수 없어요. 메인 화면에서 다시 시도해주세요.</p>
        </div>

        <!-- 로딩 -->
        <div class="card state-card" id="loadingState">
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          <p>문제를 불러오고 있어요...</p>
        </div>

        <!-- 채점 중 -->
        <div class="card state-card" id="gradingState" hidden>
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          <p>채점하고 있어요...</p>
        </div>

        <!-- 문제 풀이 레이아웃 (사이드바 + 문제 카드) -->
        <div class="quiz-layout" id="quizLayout" hidden>
          <aside class="quiz-side">
            <div class="side-book">
              <img class="side-book-img" id="sideBookImg" src="/images/book-sample.png" alt="도서 표지" />
              <div class="side-book-info">
                <h3 id="sideBookTitle">-</h3>
                <p id="sideStudentName" th:text="|${studentName} 학생|">김호호 학생</p>
              </div>
            </div>

            <div class="card progress-card">
              <p class="progress-count">문제 <span id="qIndex">1</span> / <span id="qTotal">0</span></p>
              <div class="progress-dots" id="progressDots"></div>
            </div>

            <div class="card qtype-card">
              <p class="qtype-eyebrow">출제 영역 유형</p>
              <div class="qtype-icon" id="qtypeIcon"><i class="fa-solid fa-link" aria-hidden="true"></i></div>
              <h3 id="qtypeName">-</h3>
              <p id="qtypeDesc"></p>
            </div>
          </aside>

          <div class="quiz-main">
            <div class="card quiz-card" id="quizCard">
              <div class="quiz-head">
                <span class="q-badge" id="qBadge">Q1</span>
                <h2 class="q-text" id="qText"></h2>
              </div>

              <div class="qex-box" id="qexBox" hidden>
                <p id="qexText"></p>
              </div>

              <div class="choice-list" id="choiceList"></div>
            </div>
          </div>
        </div>
        <div class="quiz-actions" id="quizActions">
          <button type="button" class="btn-ghost" id="prevBtn">이전 문제</button>
          <button type="button" class="btn-primary" id="nextBtn" disabled>다음 문제</button>
        </div>
        <!-- 결과 카드 -->
        <div class="card result-card" id="resultCard" hidden>
          <div class="result-mascot" id="resultMascot"><i class="fa-solid fa-trophy" aria-hidden="true"></i></div>
          <span class="result-grade-pill" id="resultGradePill">독서친구</span>
          <h2 id="resultTitle">문제를 다 풀었어요!</h2>
          <p class="result-score"><span id="scoreCorrect">0</span> / <span id="scoreTotal">0</span>개 정답 <span
              id="passLineText" class="result-passline"></span></p>
          <p class="result-exp" id="resultExp" hidden></p>
          <!-- 이번 제출로 새로 획득한 뱃지 (서버 newBadges) -->
          <div class="result-badges" id="resultBadges" hidden>
            <p class="result-badges-title"><i class="fa-solid fa-medal" aria-hidden="true"></i> 새로운 뱃지를 획득했어요!</p>
            <ul class="result-badge-list" id="resultBadgeList"></ul>
          </div>
          <div class="result-actions">
            <button type="button" class="btn-ghost" id="retryBtn" hidden><i class="fa-solid fa-rotate-right"
                aria-hidden="true"></i>다시 풀기</button>
            <a class="btn-secondary" id="advancedBtn" hidden
              th:href="@{/student/question(studentId=${studentId},contentId=${contentId},qlevel='02')}">
              <i class="fa-solid fa-star" aria-hidden="true"></i>심화문제 풀기</a>
            <a class="btn-primary" id="goMainBtn" th:href="@{/student/main(studentId=${studentId})}">메인으로
              돌아가기</a>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script th:src="@{/js/student-main.js}"></script>
  <script th:src="@{/js/student-question.js}"></script>
</body>

</html>
