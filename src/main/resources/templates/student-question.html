<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 문제풀이 (임시)</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student-common.css}" />
  <link rel="stylesheet" th:href="@{/css/student-question.css}" />
</head>

<body>
  <div class="app-viewport">
    <main class="page" id="questionPage" th:data-student-id="${studentId}" th:data-content-id="${contentId}"
      th:data-qlevel="${qlevel}">
      <header class="topbar">
        <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
        <div class="top-actions">
          <span class="temp-badge"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>임시 화면</span>
          <a class="back-btn" th:href="@{/student/main(studentId=${studentId})}">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>메인으로</a>
        </div>
      </header>

      <section class="quiz-wrap">
        <!-- 데이터 없음 안내 -->
        <div class="card state-card" id="emptyState" hidden>
          <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          <p id="emptyStateMsg">추천 도서 정보를 찾을 수 없어요. 메인 화면에서 다시 시도해주세요.</p>
        </div>

        <!-- 로딩 -->
        <div class="card state-card" id="loadingState">
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          <p>문제를 불러오고 있어요...</p>
        </div>

        <!-- 문제 풀이 카드 -->
        <div class="card quiz-card" id="quizCard" hidden>
          <div class="quiz-head">
            <span class="progress-text"><span id="qIndex">1</span> / <span id="qTotal">0</span>번 문제</span>
            <div class="progress-track">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>

          <div class="qex-box" id="qexBox" hidden>
            <span class="qex-label"><i class="fa-solid fa-book" aria-hidden="true"></i>보기</span>
            <p id="qexText"></p>
          </div>

          <h2 class="q-text" id="qText"></h2>

          <div class="choice-list" id="choiceList"></div>

          <div class="quiz-actions">
            <button type="button" class="btn-ghost" id="prevBtn"><i class="fa-solid fa-arrow-left"
                aria-hidden="true"></i>이전</button>
            <button type="button" class="btn-primary" id="checkBtn" disabled>정답 확인</button>
            <button type="button" class="btn-primary" id="nextBtn" hidden>다음 문제<i class="fa-solid fa-arrow-right"
                aria-hidden="true"></i></button>
          </div>
        </div>

        <!-- 채점 중 -->
        <div class="card state-card" id="gradingState" hidden>
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          <p>채점하고 있어요...</p>
        </div>

        <!-- 결과 카드 -->
        <div class="card result-card" id="resultCard" hidden>
          <div class="result-mascot" id="resultMascot"><i class="fa-solid fa-trophy" aria-hidden="true"></i></div>
          <span class="result-grade-pill" id="resultGradePill">독서친구</span>
          <h2 id="resultTitle">문제를 다 풀었어요!</h2>
          <p class="result-score"><span id="scoreCorrect">0</span> / <span id="scoreTotal">0</span>개 정답 <span
              id="passLineText" class="result-passline"></span></p>
          <p class="result-exp" id="resultExp" hidden></p>
          <div class="result-actions">
            <button type="button" class="btn-ghost" id="retryBtn" hidden><i class="fa-solid fa-rotate-right"
                aria-hidden="true"></i>다시 풀기</button>
            <a class="btn-secondary" id="advancedBtn" hidden
              th:href="@{/student/question(studentId=${studentId},contentId=${contentId},qlevel='02')}">
              <i class="fa-solid fa-star" aria-hidden="true"></i>심화문제 풀기</a>
            <a class="btn-primary" id="goMainBtn" th:href="@{/student/main(studentId=${studentId})}">메인으로
              돌아가기</a>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script th:src="@{/js/student-main.js}"></script>
  <script th:src="@{/js/student-question.js}"></script>
</body>

</html>
