<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학생 정보</title>
  <link rel="manifest" th:href="@{/manifest.json}" />

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/operation/student-info.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <!-- QR 카드 출력용 QR 생성기 (davidshimjs/qrcodejs) — 카드 QR에 시리얼 넘버 원문을 인코딩한다 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script th:src="@{/js/operation/student-info.js}"></script>
</head>

<body>

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

      <header class="page-header">
        <h1>학생 정보</h1>
        <div class="page-header-actions">
          <button type="button" id="btnPrintQrCard" class="guide-btn">
            <i class="fa-solid fa-id-card"></i>
            QR 카드 출력
          </button>
          <button type="button" id="btnGuide" class="guide-btn">
            <i class="fa-regular fa-circle-question"></i>
            사용 가이드
          </button>
        </div>
      </header>

      <!-- 필터 -->
      <section class="filter-bar">

        <div class="filter-field">
          <label for="filterGrade">학년</label>
          <select id="filterGrade">
            <option value="">전체</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="filterStatus">등록 상태</label>
          <select id="filterStatus">
            <option value="">전체</option>
            <option value="ACTIVE" selected>이용중</option>
            <option value="WITHDRAWN">탈퇴</option>
          </select>
        </div>

        <!-- 연락처/담당 선생님 필터는 DB에 대응 데이터가 없어 뺐다(2026-08-26) — 연락처는 아래 검색창이 대신한다 -->

        <div class="filter-field grow">
          <label class="sr-only" for="filterKeyword">학생명/연락처 검색</label>
          <div class="search-box">
            <input type="text" id="filterKeyword" placeholder="학생명 또는 연락처를 입력하세요." />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>

        <div class="filter-actions">
          <button type="button" id="btnSearch" class="btn primary">조회</button>
          <button type="button" id="btnFilterReset" class="btn outline">
            <i class="fa-solid fa-rotate-left"></i>
            필터 초기화
          </button>
        </div>

      </section>

      <!-- 학생 목록 -->
      <section class="student-panel">
        <div class="student-table-wrap">
          <table class="student-table">
            <colgroup>
              <col style="width:5%">
              <col style="width:11%">
              <col style="width:11%">
              <col style="width:14%">
              <col style="width:13%">
              <col style="width:13%">
              <col style="width:11%">
              <col style="width:11%">
              <col style="width:11%">
            </colgroup>
            <thead>
              <tr>
                <th>No</th>
                <th>학생명</th>
                <th>학년</th>
                <th>연락처</th>
                <th>등록일</th>
                <th>최근 이용일</th>
                <th>누적 도서(권)</th>
                <th>현재 레벨</th>
                <th>상태</th>
              </tr>
            </thead>

            <!-- /admin/students/list 응답으로 student-info.js가 채운다. 행 클릭 시 data-* 값을 읽어 상세정보 모달을 연다 -->
            <tbody id="studentListBody">
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <!--
    학생 상세정보 모달 — all_pass(자매 서비스)의 student-main-modal 구조를 그대로 가져왔다
    (탭바 .info-tab-btn, 본문 .modal-scroll, 표 .base-info-t 등 클래스 체계 동일, 색만 틸로 변경).
    다만 all_pass에는 없는 "독서이력/예약" 탭은 book_clinic 자체로 새로 만든 것.
    전체/기본 정보/회비/독서이력/예약 5개 탭. 내용은 student-info.js가 채운다.
  -->
  <div class="modal-overlay" id="studentModal" hidden>
    <div class="stu-m-con">
      <div class="stu-m-head">
        <h3 id="studentModalTitle">학생 상세정보</h3>
        <button type="button" id="btnCloseStudentModal" class="modal-close" aria-label="닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="student-tab-bar">
        <div class="info-tab-btn" id="studentTabs">
          <button type="button" class="active" data-tab="all">전체</button>
          <button type="button" data-tab="basic">기본 정보</button>
          <button type="button" data-tab="fee">회비</button>
          <button type="button" data-tab="reading">독서이력</button>
          <button type="button" data-tab="reservation">예약</button>
        </div>
      </div>

      <div class="modal-scroll" id="studentModalBody">
        <!-- 탭 패널은 student-info.js가 렌더링 -->
      </div>
    </div>
  </div>

</body>

</html>
