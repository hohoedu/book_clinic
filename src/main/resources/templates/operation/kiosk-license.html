<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기기 라이선스</title>
  <link rel="manifest" th:href="@{/manifest.json}" />

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/operation/kiosk-license.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/operation/kiosk-license.js}" defer></script>
</head>

<body>

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

      <header class="page-header">
        <h1>기기 라이선스</h1>
      </header>

      <p class="page-desc">
        센터의 출석·문제풀이 기기에서만 학생이 로그인할 수 있습니다.
        기기마다 키를 발급해 센터에 전달하면, 설치할 때 한 번 입력합니다.
      </p>

      <!-- 발급 -->
      <section class="issue-card">
        <h2>새 키 발급</h2>
        <div class="issue-form">
          <label>
            <span>센터</span>
            <select id="centerSelect"></select>
          </label>
          <label>
            <span>기기 이름</span>
            <input type="text" id="labelInput" maxlength="50" placeholder="예: 1층 출석 태블릿" />
          </label>
          <label>
            <span>등록 가능 기기 수</span>
            <input type="number" id="deviceLimitInput" min="0" step="1" value="1" />
            <small>0 = 무제한 (본사 테스트용)</small>
          </label>
          <button type="button" id="issueBtn" class="btn primary">
            <i class="fa-solid fa-key"></i> 발급
          </button>
        </div>

        <!-- 발급 직후에만 뜬다. 키 원문은 이 순간이 아니면 다시 볼 수 없다 -->
        <div class="issued-box" id="issuedBox" hidden>
          <p class="issued-warn">
            <i class="fa-solid fa-triangle-exclamation"></i>
            이 키는 <strong>지금만 볼 수 있습니다.</strong> 센터에 전달한 뒤 창을 닫으세요.
            잃어버리면 폐기하고 다시 발급해야 합니다.
          </p>
          <div class="issued-key">
            <code id="issuedKey"></code>
            <button type="button" id="copyBtn" class="btn outline">
              <i class="fa-regular fa-copy"></i> 복사
            </button>
          </div>
          <p class="issued-meta" id="issuedMeta"></p>
        </div>
      </section>

      <!-- 목록 -->
      <section class="list-card">
        <div class="list-head">
          <h2>발급된 기기</h2>
          <label class="filter">
            <span>센터</span>
            <select id="filterSelect">
              <option value="">전체</option>
            </select>
          </label>
        </div>

        <table class="kiosk-table">
          <thead>
            <tr>
              <th>센터</th>
              <th>기기 이름</th>
              <th>발급</th>
              <th>등록 기기</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="licenseBody">
            <tr class="empty"><td colspan="5">불러오는 중…</td></tr>
          </tbody>
        </table>
      </section>

    </main>
  </div>

</body>
</html>
