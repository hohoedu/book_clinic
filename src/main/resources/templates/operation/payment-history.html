<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 내역</title>
  <link rel="manifest" th:href="@{/manifest.json}" />

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/operation/payment-history.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/operation/payment-history.js}"></script>
</head>

<body>

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

      <header class="page-header">
        <h1>결제 내역</h1>
        <div class="page-header-actions">
          <button type="button" id="btnGuide" class="guide-btn">
            <i class="fa-regular fa-circle-question"></i>
            사용 가이드
          </button>
        </div>
      </header>

      <!-- 필터 -->
      <section class="filter-bar">

        <div class="filter-field">
          <label>결제 종류</label>
          <!--
            서비스 코드(BOOK/PROGRAM) 토글. 프로그램 이용권은 아직 판매 상품이 없어 목록이 비는데,
            탭을 지우지 않고 남겨 둔 이유는 상품만 등록되면 이 화면이 그대로 동작하기 때문이다.
          -->
          <div class="type-toggle" id="filterType">
            <button type="button" class="active" data-type="BOOK">책방 이용료</button>
            <button type="button" data-type="PROGRAM">프로그램 이용권</button>
          </div>
        </div>

        <div class="filter-field">
          <label for="filterMonth">이용 월</label>
          <!-- 이용권의 billing_ym(청구 년월)이다. 결제일이 아니라 "몇 월치인가"가 기준 -->
          <input type="month" id="filterMonth" />
        </div>

        <div class="filter-field">
          <label for="filterGrade">학년</label>
          <select id="filterGrade">
            <option value="">전체</option>
            <option th:each="s : ${schoolYearCodes}" th:value="${s.code}" th:text="${s.codeName}"></option>
          </select>
        </div>

        <div class="filter-field">
          <label for="filterStatus">결제 상태</label>
          <select id="filterStatus">
            <option value="">전체</option>
            <option value="IN_USE">이용중</option>
            <option value="USED_UP">이용 완료</option>
            <option value="UNPAID">미결제</option>
            <option value="PARTIAL_REFUND">부분 환불</option>
            <option value="REFUNDED">환불 완료</option>
          </select>
        </div>

        <div class="filter-field grow">
          <label class="sr-only" for="filterKeyword">학생명 검색</label>
          <span class="filter-label-text">검색</span>
          <div class="search-box">
            <input type="text" id="filterKeyword" placeholder="이름 검색" />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>

        <div class="filter-actions">
          <button type="button" id="btnSearch" class="btn primary">조회</button>
        </div>

      </section>

      <!-- 목록 -->
      <section class="payment-panel">

        <div class="panel-head">
          <p class="summary" id="paymentSummary">
            <!-- payment-history.js가 "2026년 8월 결제 내역 | 결제완료 89명 | 미결제 11명"을 채운다 -->
          </p>
          <button type="button" id="btnManualEntry" class="btn outline small">
            <i class="fa-solid fa-plus"></i>
            수기 등록
          </button>
        </div>

        <div class="payment-table-wrap">
          <table class="payment-table">
            <colgroup>
              <col style="width:6%">
              <col style="width:11%">
              <col style="width:9%">
              <col style="width:17%">
              <col style="width:13%">
              <col style="width:13%">
              <col style="width:12%">
              <col style="width:19%">
            </colgroup>
            <thead>
              <tr>
                <th>No</th>
                <th>학생</th>
                <th>학년</th>
                <th>결제일</th>
                <th>결제 금액</th>
                <th>환불 금액</th>
                <th>사용횟수</th>
                <th>이용권 상태</th>
              </tr>
            </thead>

            <!-- /admin/payment/history/list 응답으로 payment-history.js가 채운다.
                 행을 클릭하면 바로 아래에 차감/결제 상세 행이 펼쳐진다 -->
            <tbody id="paymentListBody"></tbody>
          </table>
        </div>

      </section>

    </main>

  </div>

</body>

</html>
