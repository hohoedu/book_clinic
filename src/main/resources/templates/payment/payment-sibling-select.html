<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>결제 대상 선택</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
               margin: 0; padding: 24px; background: #f7f8fa; }
        .box { max-width: 480px; margin: 0 auto; background: #fff;
               border-radius: 12px; padding: 24px; }
        h2 { margin: 0 0 6px; font-size: 18px; }
        .sub { margin: 0 0 20px; font-size: 13px; color: #888; }
        .item { display: flex; align-items: center; justify-content: space-between;
                padding: 14px 4px; border-bottom: 1px solid #f0f0f0; }
        .item label { display: flex; align-items: center; gap: 10px; font-size: 15px; }
        .item input[type="checkbox"] { width: 18px; height: 18px; }
        .item .price { color: #888; font-size: 14px; }
        .total { display: flex; justify-content: space-between; padding-top: 16px;
                 font-size: 18px; font-weight: 600; }
        button { width: 100%; margin-top: 24px; padding: 16px; font-size: 16px; font-weight: 600;
                 border: 0; border-radius: 8px; background: #1f6feb; color: #fff; }
        button:disabled { background: #c9c9c9; }
    </style>
</head>
<body>

<div class="box">
    <h2>결제할 학생을 선택해주세요</h2>
    <p class="sub" th:text="${productName} + ' · 1인당 ' + ${#numbers.formatInteger(price, 0, 'COMMA')} + '원'"></p>

    <form id="groupForm" method="post" th:action="@{/payment/checkout/group}">
        <input type="hidden" name="productCode" th:value="${productCode}">

        <div class="item" th:each="sibling : ${siblings}">
            <label>
                <input type="checkbox" name="studentIds" th:value="${sibling.studentId}"
                       th:checked="${sibling.studentId == selfStudentId}"
                       onchange="updateTotal()">
                <span th:text="${sibling.studentName}"></span>
            </label>
            <span class="price" th:text="${#numbers.formatInteger(price, 0, 'COMMA')} + '원'"></span>
        </div>

        <div class="total">
            <span>합계</span>
            <span id="totalAmount">0원</span>
        </div>

        <button type="submit" id="submitBtn">결제 계속하기</button>
    </form>
</div>

<script th:inline="javascript">
    const unitPrice = /*[[${price}]]*/ 0;

    function updateTotal() {
        const checked = document.querySelectorAll('input[name="studentIds"]:checked').length;
        const total = checked * unitPrice;
        document.getElementById('totalAmount').textContent = total.toLocaleString('ko-KR') + '원';
        document.getElementById('submitBtn').disabled = checked === 0;
    }

    updateTotal();
</script>

</body>
</html>
