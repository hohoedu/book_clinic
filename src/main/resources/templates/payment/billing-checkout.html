<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>자동결제 카드 등록</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
               margin: 0; padding: 24px; background: #f7f8fa; }
        .box { max-width: 480px; margin: 0 auto; background: #fff;
               border-radius: 12px; padding: 24px; }
        h2 { margin: 0 0 20px; font-size: 18px; }
        .row { display: flex; justify-content: space-between; padding: 10px 0;
               border-bottom: 1px solid #f0f0f0; font-size: 15px; }
        .row span:first-child { color: #888; }
        .total { font-size: 18px; font-weight: 600; padding-top: 16px; border-bottom: 0; }
        button { width: 100%; margin-top: 24px; padding: 16px; font-size: 16px; font-weight: 600;
                 border: 0; border-radius: 8px; background: #1f6feb; color: #fff; }
        .note { margin-top: 16px; padding: 12px; background: #f1f5fb; border-radius: 8px;
                font-size: 13px; color: #46536b; line-height: 1.6; }
        .warn { margin-top: 12px; padding: 12px; background: #fff8e1; border-radius: 8px;
                font-size: 13px; color: #8a6d3b; line-height: 1.5; }
    </style>
</head>
<body>

<div class="box">
    <h2>자동결제 카드 등록</h2>
    <div class="row"><span>상품</span><span th:text="${goodName}"></span></div>
    <div class="row"><span>등록 학생</span><span th:text="${studentCount} + '명'"></span></div>
    <div class="row total">
        <span>매월 결제 금액</span>
        <span th:text="${#numbers.formatInteger(monthlyAmount, 0, 'COMMA')} + '원'"></span>
    </div>

    <button type="button" onclick="document.getElementById('billreg').submit()">카드 등록하기</button>

    <div class="note">
        카드를 등록하면 오늘 첫 결제가 진행되고, 이후 매월 같은 날짜에 자동으로 결제됩니다.<br>
        해지는 앱의 자동결제 화면에서 언제든 하실 수 있습니다.
    </div>

    <div class="warn" th:if="${testMode}">
        테스트 상점이라 실제로 돈이 빠져나가지 않습니다.
    </div>
</div>

<!--
  이니시스 INILite 모바일 빌키발급 창으로 보내는 폼.
  규격: docs/billing/INIbill_mo_req_new.jsp (2026-09-08 확인)

  요청 URL : https://inilitepay.inicis.com/pay/card/billing  (billingUrl로 주입)
  hashData : SHA-512(price + mid + orderId + timestamp + INILitekey) — 서버(BillingRegViewController)가 계산
  [price]  : 발급 시점에 실승인되는 금액이라 첫 주기 결제액(형제 합산 월액)을 그대로 보낸다.
             이 승인 1건이 곧 첫 청구다 — 서버는 빌키로 billing() API를 다시 부르지 않는다.
  [orderId]: 결제창이 그대로 되돌려주므로(returnUrl POST의 orderId) 이 값으로 등록 건을 되짚는다.
  리턴 필드: resultCode / resultMessage / tid / billkey / orderId / billkeyDate / billkeyTime
-->
<form id="billreg" name="billreg" method="post" th:action="${billingUrl}" accept-charset="UTF-8">
    <input type="hidden" name="mid" th:value="${mid}">
    <input type="hidden" name="orderId" th:value="${oid}">
    <input type="hidden" name="price" th:value="${price}">
    <input type="hidden" name="goodName" th:value="${goodName}">
    <input type="hidden" name="buyerName" th:value="${buyerName}">
    <input type="hidden" name="buyerEmail" value="test@hohoedu.com">
    <input type="hidden" name="buyerTel" value="01000000000">
    <input type="hidden" name="merchantRedirectData" value="">
    <input type="hidden" name="returnUrl" th:value="${returnUrl}">
    <input type="hidden" name="timestamp" th:value="${timestamp}">
    <input type="hidden" name="clientIp" th:value="${clientIp}">
    <input type="hidden" name="url" th:value="${siteUrl}">
    <input type="hidden" name="hashData" th:value="${hashData}">
</form>

</body>
</html>
