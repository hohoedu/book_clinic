<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예약 현황</title>

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/monitor/reservation.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
</head>

<body>

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content reservation-content">

      <header class="page-header">
        <h1>예약 현황</h1>
        <button type="button" id="btnGuide" class="guide-btn">
          <i class="fa-regular fa-circle-question"></i>
          사용 가이드
        </button>
      </header>

      <div class="reservation-scroll">

        <!-- 조회 날짜 / 검색 -->
        <section class="reservation-toolbar">
          <div class="toolbar-group">
            <span class="toolbar-label">조회 날짜</span>
            <div class="date-picker-wrap">
              <div class="monitor-date-picker">
                <span class="monitor-date-display" id="reservationDateDisplay"></span>
                <div class="monitor-date-trigger">
                  <i class="fa-regular fa-calendar"></i>
                  <input type="date" id="reservationDate" />
                </div>
              </div>
              <div class="date-nav">
                <button type="button" id="btnPrevDay" class="btn outline small"><i class="fa-solid fa-chevron-left"></i>
                  이전 날</button>
                <button type="button" id="btnToday" class="btn outline small">오늘</button>
                <button type="button" id="btnNextDay" class="btn outline small">다음 날 <i
                    class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>
          </div>

          <div class="toolbar-group">
            <span class="toolbar-label">검색</span>
            <div class="serch-box-wrap">
              <div class="search-box">
                <input type="text" id="studentSearchKeyword" placeholder="이름 검색" />
                <i class="fa-solid fa-magnifying-glass"></i>
              </div>
              <button type="button" id="btnSearch" class="btn primary small" style="width: 100px;">조회</button>
            </div>
          </div>
        </section>

        <div class="reservation-grid">

          <!-- 왼쪽: 회차별 현황 + 예약자 목록 -->
          <div class="reservation-main">
            <section class="panel-card">
              <div class="panel-head">
                <h2>회차별 예약 현황</h2>
              </div>
              <p class="panel-desc" id="roundSummaryDesc">불러오는 중...</p>

              <div class="round-card-grid" id="roundCardGrid"></div>
            </section>

            <section class="panel-card reservation-list-card">
              <div class="panel-head">
                <h2><span class="round-highlight" id="listRoundLabel">전체</span> 예약자 목록 <span class="round-list-sub" id="listRoundSub"></span></h2>
                <button type="button" id="btnAddReservation" class="btn outline small"><i class="fa-solid fa-plus"></i>
                  예약 등록</button>
              </div>

              <div class="reservation-table-wrap">
                <table class="reservation-table reservation-table-head">
                  <colgroup>
                    <col style="width:6%">
                    <col style="width:10%">
                    <col style="width:8%">
                    <col style="width:14%">
                    <col style="width:12%">
                    <col style="width:12%">
                    <col style="width:14%">
                    <col style="width:10%">
                    <col style="width:14%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th>No</th>
                      <th>학생</th>
                      <th>학년</th>
                      <th>연락처</th>
                      <th>예약방법</th>
                      <th>상태</th>
                      <th>사유</th>
                      <th>이번 달 출석</th>
                      <th></th>
                    </tr>
                  </thead>
                </table>
                <div class="reservation-table-body-scroll">
                  <table class="reservation-table reservation-table-body">
                    <colgroup>
                      <col style="width:6%">
                      <col style="width:10%">
                      <col style="width:8%">
                      <col style="width:14%">
                      <col style="width:12%">
                      <col style="width:12%">
                      <col style="width:14%">
                      <col style="width:10%">
                      <col style="width:14%">
                    </colgroup>
                    <tbody id="reservationListBody"></tbody>
                  </table>
                </div>
              </div>
            </section>

          </div>

          <!-- 오른쪽: 예약 변경 패널 -->
          <aside class="panel-card change-panel" id="changePanel">
            <div class="panel-head">
              <h2 id="changePanelTitle">예약 등록</h2>
            </div>
            <p class="panel-desc" id="changePanelDesc">선택한 학생의 예약을 등록합니다.</p>

            <!-- 내용이 패널 높이를 넘어서면(화면 확대 등) 카드 밖으로 튀어나오지 않고 이 안에서만
                 스크롤되게 한다 — 버튼 영역(change-panel-actions)은 항상 바닥에 고정 -->
            <div class="change-panel-body" id="changePanelBody">

            <div class="current-reservation-box" id="currentReservationBox" hidden>
              <span class="current-reservation-title"><span id="changeTargetName"></span> 학생의 현재 예약정보</span>
              <div class="current-reservation-info">
                <div class="info-cell">
                  <span class="info-label">예약 날짜</span>
                  <span class="info-value" id="currentResDate"></span>
                </div>
                <div class="info-cell">
                  <span class="info-label">예약 회차</span>
                  <span class="info-value" id="currentResRound"></span>
                </div>
              </div>
            </div>

            <div class="field-group divider-group">
              <label for="changeDate" id="changeDateLabel">등록 날짜</label>
              <div class="date-input-wrap">
                <input type="date" id="changeDate" />
              </div>
            </div>

            <div class="field-group divider-group">
              <label id="changeRoundLabel">등록 회차</label>
              <div class="round-pick-scroll">
                <ul class="round-pick-list" id="roundPickList"></ul>
              </div>
            </div>

            <!-- 예약 등록 모드에서만 노출 — 선택한 회차에 이미 예약된 학생을 제외한 학생 목록 -->
            <div class="field-group student-pick-group" id="studentPickGroup">
              <div class="student-pick-head">
                <label>학생 목록</label>
                <div class="student-pick-search-group">
                  <input type="text" id="studentPickSearch" class="student-pick-search" placeholder="이름 검색" />
                  <button type="button" id="btnStudentPickSearch" class="btn primary student-pick-search-btn">조회</button>
                </div>
              </div>
              <div class="student-pick-table-wrap">
                <table class="student-pick-table student-pick-table-head">
                  <colgroup>
                    <col style="width:10%">
                    <col style="width:30%">
                    <col style="width:20%">
                    <col style="width:40%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th></th>
                      <th>이름</th>
                      <th>학년</th>
                      <th>연락처</th>
                    </tr>
                  </thead>
                </table>
                <div class="student-pick-list" id="studentPickList">
                <table class="student-pick-table student-pick-table-body">
                  <colgroup>
                    <col style="width:10%">
                    <col style="width:30%">
                    <col style="width:20%">
                    <col style="width:40%">
                  </colgroup>
                  <tbody id="studentPickBody"></tbody>
                </table>
                </div>
              </div>
            </div>

            <div class="field-group" id="changeReasonGroup">
              <label for="changeReason" id="changeReasonLabel">등록 사유</label>
              <textarea id="changeReason" rows="3" placeholder="사유를 작성해 주세요."></textarea>
            </div>

            </div>

            <div class="change-panel-actions">
              <button type="button" id="btnCancelReservation" class="btn danger-outline" hidden>예약 취소</button>
              <button type="button" id="btnSaveChange" class="btn primary">예약 등록</button>
            </div>
          </aside>

        </div>

      </div>

    </main>

  </div>

  <script th:src="@{/js/monitor/reservation.js}"></script>
</body>

</html>
