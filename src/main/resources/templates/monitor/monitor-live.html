<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 모니터링</title>

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/monitor/monitor-live.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- 관리자 브라우저가 Firestore를 직접 구독(onSnapshot)하기 위한 Firebase Web SDK.
       gstatic CDN 대신 앱 자체 origin(/js/vendor/firebase/)에서 서빙한다 — 외부 CDN이 막힌 망이나
       오프라인에서도 실시간 구독이 뜨게 하기 위함(PWA 배포 대상 환경 대비). 벤더 파일 3개는
       gstatic 10.12.2 원본을 그대로 받아온 것이고, auth/firestore 내부의 firebase-app import 경로만
       로컬로 치환해 두었다. 버전 업그레이드 시 세 파일 모두 다시 받아 같은 치환을 반복할 것.
       모듈 로드 실패 시 콘솔에 원인을 남기고, monitor-live.js의 connectFirestore가 폴백 폴링으로 동작. -->
  <script type="module">
    import { initializeApp } from "/js/vendor/firebase/firebase-app.js";
    import { getAuth, signInWithCustomToken } from "/js/vendor/firebase/firebase-auth.js";
    import { getFirestore, collection, query, where, onSnapshot }
      from "/js/vendor/firebase/firebase-firestore.js";

    window.__monitorFirebase = { initializeApp, getAuth, signInWithCustomToken, getFirestore, collection, query, where, onSnapshot };
  </script>
  <script type="module">
    // 위 모듈 그래프가 로드에 실패하면 window.__monitorFirebase가 안 생겨 실시간 구독이 조용히
    // 폴백 폴링으로만 동작한다 — 원인을 콘솔에 명시적으로 남긴다.
    window.addEventListener("error", (e) => {
      if (e?.filename && e.filename.includes("/js/vendor/firebase/")) {
        console.error("[monitor] Firebase SDK 로컬 모듈 로드 실패 — 실시간 구독 불가, 30초 폴백 폴링으로 동작", e.message, e.filename);
      }
    });
  </script>

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
</head>

<body th:attr="data-center-code=${centerCode},
               data-firebase-api-key=${firebaseWebApiKey},
               data-firebase-auth-domain=${firebaseWebAuthDomain},
               data-firebase-project-id=${firebaseWebProjectId},
               data-firebase-storage-bucket=${firebaseWebStorageBucket},
               data-firebase-messaging-sender-id=${firebaseWebMessagingSenderId},
               data-firebase-app-id=${firebaseWebAppId}">

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content monitor-content">

      <header class="page-header">
        <h1>실시간 모니터링</h1>
        <button class="guide-btn">
          <i class="fa-regular fa-circle-question"></i>
          사용 가이드
        </button>
      </header>

      <section class="monitor-toolbar">
        <div class="monitor-date-picker">
          <span class="monitor-date-display" id="monitorDateDisplay">2026. 07. 14</span>
          <div class="monitor-date-trigger">
            <i class="fa-regular fa-calendar"></i>
            <input type="date" id="monitorDate" value="2026-07-14" />
          </div>
        </div>

        <!-- 교시 목록은 아직 별도 마스터 데이터가 없어 monitor-live.js에 고정 목록으로 둔다 -->
        <select class="monitor-slot-picker" id="monitorSlot">
          <option>1교시(14:00~15:00)</option>
          <option>2교시(15:00~16:00)</option>
        </select>

        <!-- 필터 chip은 monitor-live.js가 카운트와 함께 렌더링한다 -->
        <div class="monitor-filters" id="monitorFilters"></div>
      </section>

      <section class="monitor-body">
        <!-- 타임별로 순차 노출하던 방식 대신, 그날 예약된 학생 전체를 입실/미입실/퇴실 3개 영역으로
             나눠서 보여준다(2026-07-29) — 한 목록에 다 몰려있는 것보다 가독성이 좋다 -->
        <div class="monitor-sections" id="monitorSections">
          <section class="monitor-section">
            <h2 class="monitor-section-title">
              입실한 학생 <span class="monitor-section-count" id="enteredCount">0</span>
            </h2>
            <div class="monitor-grid" id="enteredGrid"></div>
          </section>
          <section class="monitor-section">
            <h2 class="monitor-section-title">
              미입실 학생 <span class="monitor-section-count" id="notEnteredCount">0</span>
            </h2>
            <div class="monitor-grid" id="notEnteredGrid"></div>
          </section>
          <section class="monitor-section">
            <h2 class="monitor-section-title">
              퇴실한 학생 <span class="monitor-section-count" id="exitedCount">0</span>
            </h2>
            <div class="monitor-grid" id="exitedGrid"></div>
          </section>
        </div>

        <!-- 독서일지 패널 — 카드의 말풍선 아이콘을 클릭하면 그 학생 기준으로 채워진다.
             바깥(reading-log-panel)은 width/opacity만 움직이는 슬라이드 껍데기이고, 안쪽
             (reading-log-panel-inner)은 항상 최종 너비로 고정해서 애니메이션 중 콘텐츠가
             리플로우(줄바꿈)되지 않게 한다. -->
        <aside class="reading-log-panel" id="readingLogPanel">
        <div class="reading-log-panel-inner">
          <div class="reading-log-panel-header">
            <h3><span id="readingLogStudentName"></span> 독서일지 등록</h3>
            <button type="button" id="btnCloseReadingLog" class="log-panel-close" title="닫기"><i class="fa-solid fa-xmark"></i></button>
          </div>

          <div class="log-section">
            <div class="log-section-title">독서 태도</div>
            <!-- monitor-live.js가 ATTITUDE_CODES 기준으로 렌더링한다 -->
            <div class="log-checkbox-group" id="attitudeCheckboxGroup"></div>
          </div>

          <div class="log-section">
            <div class="log-section-title">도움 필요</div>
            <!-- monitor-live.js가 HELP_NEEDED_CODES 기준으로 렌더링한다 -->
            <div class="log-checkbox-group help-needed-group" id="helpNeededCheckboxGroup"></div>
          </div>

          <div class="log-section">
            <div class="log-section-title">기타 전달사항</div>
            <textarea id="readingLogNote" placeholder="기타 전달사항을 입력해 주세요."></textarea>
          </div>

          <button type="button" id="btnSaveReadingLog" class="btn primary">저장</button>
        </div>
        </aside>
      </section>

    </main>

  </div>

  <!--
    추천 도서 교체 모달 (2026-09-02) — 추천된 책이 서가에 없거나 못 읽을 정도로 훼손됐을 때.
    사유를 고르면 그 한 권이 재고에서 빠지고(다음 학생에게 다시 추천되지 않는다) 곧바로 다음 책이 추천된다.
  -->
  <div class="modal-overlay" id="bookSwapModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>추천 도서 교체</h3>
        <button type="button" class="modal-close" id="bookSwapCloseBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p class="swap-target" id="bookSwapTarget"></p>
        <p class="swap-desc">
          이 책을 추천에서 빼고 다음 책을 바로 추천합니다.<br>
          고른 사유대로 <b>이 책 한 권이 재고에서 빠져</b> 다른 학생에게도 추천되지 않습니다.
        </p>
        <div class="swap-reasons">
          <label class="swap-reason">
            <input type="radio" name="bookSwapReason" value="MISSING" checked>
            <span><b>책이 없어요</b><em>서가에서 찾을 수 없음 (나중에 찾으면 도서관리에서 복구)</em></span>
          </label>
          <label class="swap-reason">
            <input type="radio" name="bookSwapReason" value="DAMAGED">
            <span><b>훼손됐어요</b><em>못 읽을 정도로 손상됨</em></span>
          </label>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn outline" id="bookSwapCancelBtn">취소</button>
        <button type="button" class="btn primary" id="bookSwapConfirmBtn">교체하기</button>
      </div>
    </div>
  </div>

  <script th:src="@{/js/monitor/monitor-live.js}"></script>
</body>

</html>
