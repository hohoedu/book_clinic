<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도서 데이터 관리</title>
  <link rel="manifest" th:href="@{/manifest.json}" />

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/data/book-data.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Summernote (지문 예시 입력 에디터) — jQuery 의존 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
  <script th:src="@{/js/data/book-data.js}"></script>
  <script src="https://kit.fontawesome.com/본인키트주소.js" crossorigin="anonymous"></script>
</head>

<body>

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content">

      <header class="page-header">
        <h1>도서 데이터 관리</h1>
        <div class="page-header-actions">
          <button id="btnGuideLogout" class="guide-btn">
            <i class="fa-regular fa-circle-question"></i>
            사용 가이드
          </button>
        </div>
      </header>

      <section class="toolbar">
        <div class="toolbar-left">
          <!-- 옵션은 book-data.js에서 코드값 기준으로 렌더링 -->
          <select id="filterGrade">
            <option value="">학년 전체</option>
          </select>

          <select id="filterContentType">
            <option value="">분류 전체</option>
            <option th:each="ct : ${contentTypeCodes}" th:value="${ct.code}" th:text="${ct.codeName}"></option>
          </select>

          <select id="filterState">
            <option value="">사용여부 전체</option>
            <option value="Y">사용중</option>
            <option value="N">절판</option>
          </select>

          <div class="search-box">
            <input type="text" id="toolbarSearch" placeholder="도서명 검색" />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>

          <button type="button" id="btnSearch" class="btn primary">조회</button>
        </div>

        <div class="toolbar-right">
          <!-- <button type="button" id="btnGradeExcel" class="btn outline">학년별 목록 엑셀</button> -->
          <button type="button" id="btnDeletedBooks" class="btn outline">삭제 도서함</button>
          <button type="button" id="btnNewBook" class="btn outline">+ 신규 도서 등록</button>
          <button type="button" id="btnDeleteSelected" class="btn danger-outline">선택 도서 삭제</button>
          <button type="button" id="btnSaveBook" class="btn primary">저장</button>
        </div>
      </section>

      <section class="workspace">

        <!-- 도서 목록 -->
        <section class="panel book-list-panel">
          <h2>도서 목록</h2>

          <!-- TODO: 도서목록에서의 검색기능 숨김 - 추후 필요 시 hidden 제거하여 복구 -->
          <div class="list-search" hidden>
            <div class="search-box">
              <input type="text" id="listSearch" placeholder="도서명, 저자, 키워드 검색" />
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button type="button" id="btnDetailFilter" class="btn outline small">
              <i class="fa-solid fa-sliders"></i>
              상세 필터
            </button>
          </div>

          <!-- 상세 필터 (저자 / 장르 / 키워드) -->
          <div class="detail-filter" id="detailFilterPanel" hidden>
            <div class="detail-filter-row">
              <label>저자</label>
              <input type="text" id="filterAuthor" placeholder="저자명" />
            </div>
            <div class="detail-filter-row">
              <label>장르</label>
              <select id="filterGenre">
                <option value="">전체</option>
              </select>
            </div>
            <div class="detail-filter-row">
              <label>키워드</label>
              <input type="text" id="filterKeyword" placeholder="키워드" />
            </div>
            <div class="detail-filter-actions">
              <button type="button" id="btnDetailReset" class="btn outline small">초기화</button>
              <button type="button" id="btnDetailApply" class="btn primary small">필터 적용</button>
            </div>
          </div>

          <!-- 도서 목록은 book-data.js에서 렌더링 -->
          <ul class="book-list"></ul>
        </section>

        <!-- 도서 정보 -->
        <section class="panel book-info-panel">
          <div class="panel-title-row">
            <h2><span id="bookInfoTitle">[프린들 주세요]</span> 도서 정보</h2>
            <div class="status-toggle">
              <!-- 문제가 등록되어있지 않는 경우 사용중으로 변경 불가 -->
              <input type="radio" name="bookStatus" id="status-use" value="use" checked>
              <label for="status-use">
                사용중
              </label>
              <input type="radio" name="bookStatus" id="status-stop" value="stop">
              <label for="status-stop">
                절판
              </label>
            </div>
          </div>

          <form class="book-form">
            <div class="form-row">
              <label>도서명</label>
              <input type="text" id="bookInfoTitleInput" />
            </div>

            <div class="form-row image-row">
              <label>도서 이미지</label>
              <div class="image-area">
                <img id="bookInfoImage" th:src="@{/images/book-sample.png}" alt="">
                <div class="image-actions">
                  <input type="file" id="bookImageInput" accept="image/*" hidden>
                  <button type="button" id="btnImageChange" class="btn outline small">이미지 변경</button>
                  <button type="button" id="btnImageDelete" class="btn danger-outline small">이미지 삭제</button>
                </div>
              </div>
            </div>

            <div class="form-row">
              <label>저자</label>
              <input type="text" id="bookInfoAuthorInput" />
            </div>

            <div class="form-row">
              <label>출판사</label>
              <input type="text" id="bookInfoPublisherInput" />
            </div>

            <div class="form-row">
              <label>권장학년</label>
              <select id="bookInfoGradeSelect">
                <option>7세</option>
                <option>초1</option>
                <option>초2</option>
                <option>초3</option>
                <option>초4</option>
                <option>초5</option>
                <option>초6</option>
                <option>중등</option>
              </select>
            </div>

            <div class="form-row">
              <label>분류</label>
              <!-- 분류 chip은 서버(erp_bookstore_code, gubun='C')에서 조회해 렌더링, 클릭(단일 선택)은 book-data.js -->
              <div class="chip-group" id="contentTypeChips">
                <button type="button" class="chip" th:each="ct : ${contentTypeCodes}"
                        th:data-code="${ct.code}" th:text="${ct.codeName}"></button>
              </div>
            </div>

            <div class="form-row">
              <label>장르</label>
              <!-- 장르 옵션은 서버(erp_bookstore_code, gubun='G')에서 조회해 렌더링 -->
              <select id="bookInfoGenreSelect">
                <option value="">선택</option>
                <option th:each="g : ${genreCodes}" th:value="${g.code}" th:text="${g.codeName}"></option>
              </select>
            </div>

            <div class="form-row">
              <label>해시태그</label>
              <div class="tag-input-area">
                <div class="tag-list"></div>
                <input type="text" id="categoryInput">
              </div>
            </div>

            <div class="form-row">
              <label>독서 예상 시간</label>
              <!-- value는 숫자만 저장(예: 15), 표시만 '분' -->
              <select id="bookInfoReadingTime">
                <option value="">선택</option>
                <option value="10">10분</option>
                <option value="15">15분</option>
                <option value="20">20분</option>
                <option value="25">25분</option>
                <option value="30">30분</option>
                <option value="35">35분</option>
                <option value="40">40분</option>
                <option value="45">45분</option>
                <option value="50">50분</option>
              </select>
            </div>

            <div class="form-row">
              <label>난이도</label>
              <select id="bookInfoDifficulty">
                <option value="">선택</option>
                <option value="상">상</option>
                <option value="중">중</option>
                <option value="하">하</option>
              </select>
            </div>

            <div class="form-row">
              <label>도서 소개</label>
              <textarea id="bookInfoSummary" placeholder="도서 소개글을 작성해 주세요."></textarea>
            </div>

            <!-- 분류가 교과연계/기관추천/인증수상작일 때만 노출 (book-data.js updateExtraDetailField) — 폼 맨 아래 위치 고정 -->
            <div class="form-row" id="extraDetailRow" hidden>
              <label id="extraDetailLabel"></label>
              <input type="text" id="bookInfoExtraDetail">
            </div>

            <!-- 비본사(지점) 우리 센터 하위 도서 — 기본 숨김, 비본사 도서 선택 시 노출 -->
            <div class="branch-item-panel" id="branchItemPanel" hidden>
              <h3>하위도서</h3>
              <!-- 하위 도서 카드는 book-data.js에서 렌더링 (기존=수정/삭제, 신규=취소/등록) -->
              <div class="branch-item-list" id="branchItemList"></div>
            </div>
          </form>
        </section>

        <!-- 문제 출제 -->
        <section class="panel question-panel">
          <div class="panel-title-row">
            <h2>문제 출제</h2>
          </div>

          <div class="question-tabs">
            <button type="button" class="active" data-level="01">기본문제</button>
            <button type="button" data-level="02">심화문제</button>
          </div>

          <!-- 문제 번호 / 문제 카드는 book-data.js에서 렌더링 -->
          <div class="question-numbers"></div>

          <article class="question-editor"></article>
        </section>

      </section>

    </main>

  </div>

  <!-- 삭제 도서함 모달 -->
  <div class="modal-overlay" id="deletedModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>삭제된 도서</h3>
        <button type="button" id="btnCloseDeleted" class="modal-close" aria-label="닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="deleted-search">
          <input type="text" id="deletedSearchInput" placeholder="도서명, 저자로 검색">
        </div>
        <ul class="deleted-list" id="deletedList"></ul>
      </div>
    </div>
  </div>

</body>

</html>
