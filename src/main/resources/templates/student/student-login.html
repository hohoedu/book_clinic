<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 학생 로그인</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student/student-common.css}" />
  <link rel="stylesheet" th:href="@{/css/student/student-login.css}" />
</head>

<body>
  <div class="pass-exhausted-overlay" th:if="${noReservation}" id="noReservationModal">
    <div class="pass-exhausted-box">
      <i class="fa-solid fa-calendar-xmark" aria-hidden="true"></i>
      <h2>오늘은 등록된 예약이 없어요</h2>
      <p></p>
      <button type="button" id="noReservationOk">확인</button>
    </div>
  </div>

  <div class="pass-exhausted-overlay" th:if="${alreadyExited}" id="alreadyExitedModal">
    <div class="pass-exhausted-box">
      <i class="fa-solid fa-door-open" aria-hidden="true"></i>
      <h2>이미 퇴실했습니다</h2>
      <p></p>
      <button type="button" id="alreadyExitedOk">확인</button>
    </div>
  </div>

  <div class="pass-exhausted-overlay" th:if="${notEntered}" id="notEnteredModal">
    <div class="pass-exhausted-box">
      <i class="fa-solid fa-door-closed" aria-hidden="true"></i>
      <h2>입실을 먼저 해주세요</h2>
      <p>출석체크 기기에서 입실 후 다시 로그인해주세요.</p>
      <button type="button" id="notEnteredOk">확인</button>
    </div>
  </div>

  <div class="login-viewport">
    <form class="login-card" id="loginForm" th:action="@{/student/login}" method="post">
      <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
      <h1>학생 로그인</h1>
      <p class="login-error" th:if="${error}" th:text="${error}">에러 메시지</p>

      <!-- QR 모드 -->
      <div id="qrMode">
        <div class="qr-inline" id="qrInline">
          <video id="qrInlineVideo" autoplay playsinline muted></video>
          <p class="qr-inline-hint">학생증 QR을 사각형 안에 맞춰주세요</p>
          <p class="qr-inline-error" id="qrInlineError" hidden></p>
        </div>
      </div>

      <!-- 앱 아이디 모드 -->
      <div id="manualMode" hidden>
        <input type="text" name="appId" placeholder="앱 아이디 (appId)" required />
        <button type="submit">입장하기</button>
      </div>

      <button type="button" class="alt-login-btn" id="toggleModeBtn">다른 방법으로 로그인</button>
    </form>
    <!-- 이 기기를 출석체크용으로 바꾸고 싶을 때. 다시 /launch로 보내 용도를 새로 고른다 -->
    <button type="button" class="change-mode-btn" id="changeModeBtn">기기 용도 변경</button>
  </div>
  <script th:src="@{/js/vendor/jsqr/jsQR.js}"></script>
  <script th:src="@{/js/student/student-login.js}"></script>
</body>

</html>
