<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 학생 로그인</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student/student-common.css}" />
  <style>
    .login-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 420px;
      max-width: 90vw;
      background: rgba(255, 255, 255, .95);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      text-align: center;
    }

    .login-card .logo {
      width: 120px;
      margin-bottom: 24px;
    }

    .login-card h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    .login-card p {
      font-size: 14px;
      color: #888;
      margin: 0 0 28px;
    }

    .login-card input {
      width: 100%;
      box-sizing: border-box;
      height: 52px;
      border-radius: 12px;
      border: 1px solid #ddd;
      padding: 0 16px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .login-card button {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
    }

    .login-error {
      color: var(--red);
      font-size: 13px;
      margin: -6px 0 14px;
    }
  </style>
</head>

<body>
  <div class="login-viewport">
    <form class="login-card" th:action="@{/student/login}" method="post">
      <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
      <h1>학생 로그인</h1>
      <p>QR 스캔 대신 임시로 앱 아이디를 입력해주세요</p>
      <p class="login-error" th:if="${error}" th:text="${error}">에러 메시지</p>
      <input type="text" name="appId" placeholder="앱 아이디 (appId)" autofocus required />
      <button type="submit">입장하기</button>
    </form>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.error('Service worker 등록 실패:', err);
        });
      });
    }
  </script>
</body>

</html>
