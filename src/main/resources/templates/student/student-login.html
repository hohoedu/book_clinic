<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 학생 로그인</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student/student-common.css}" />
  <link rel="stylesheet" th:href="@{/css/student/qr-scan.css}" />
  <style>
    .login-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 420px;
      max-width: 90vw;
      background: rgba(255, 255, 255, .95);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      text-align: center;
    }

    .login-card .logo {
      width: 120px;
      margin-bottom: 24px;
    }

    .login-card h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    .login-card p {
      font-size: 14px;
      color: #888;
      margin: 0 0 28px;
    }

    .login-card input {
      width: 100%;
      box-sizing: border-box;
      height: 52px;
      border-radius: 12px;
      border: 1px solid #ddd;
      padding: 0 16px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .login-card button {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
    }

    .login-error {
      color: var(--red);
      font-size: 13px;
      margin: -6px 0 14px;
    }

    .qr-login-btn {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: 2px solid var(--blue);
      background: #fff;
      color: var(--blue);
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-divider {
      font-size: 12px;
      color: #aaa;
      margin: -2px 0 14px;
    }

    .pass-exhausted-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .72);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pass-exhausted-box {
      width: 360px;
      max-width: 90vw;
      background: #fff;
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-sizing: border-box;
      text-align: center;
    }

    .pass-exhausted-box i {
      font-size: 40px;
      color: var(--orange);
      margin-bottom: 14px;
    }

    .pass-exhausted-box h2 {
      font-size: 18px;
      margin: 0 0 8px;
    }

    .pass-exhausted-box p {
      font-size: 14px;
      color: #888;
      margin: 0 0 24px;
    }

    .pass-exhausted-box button {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
    }

    .change-mode-btn {
      margin-top: 20px;
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
    }

    .change-mode-btn:hover {
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="pass-exhausted-overlay" th:if="${passExhausted}" id="passExhaustedModal">
    <div class="pass-exhausted-box">
      <i class="fa-solid fa-ticket" aria-hidden="true"></i>
      <h2>이용권이 모두 소진되었어요</h2>
      <p>선생님께 말씀드리고 이용권을 다시 등록해주세요.</p>
      <button type="button" id="passExhaustedOk">확인</button>
    </div>
  </div>

  <div class="pass-exhausted-overlay" th:if="${noReservation}" id="noReservationModal">
    <div class="pass-exhausted-box">
      <i class="fa-solid fa-calendar-xmark" aria-hidden="true"></i>
      <h2>오늘은 등록된 예약이 없어요</h2>
      <p>선생님께 말씀드려요.</p>
      <button type="button" id="noReservationOk">확인</button>
    </div>
  </div>

  <div class="pass-exhausted-overlay" th:if="${alreadyExited}" id="alreadyExitedModal">
    <div class="pass-exhausted-box">
      <i class="fa-solid fa-door-open" aria-hidden="true"></i>
      <h2>이미 퇴실했습니다</h2>
      <p>선생님께 말씀드려요.</p>
      <button type="button" id="alreadyExitedOk">확인</button>
    </div>
  </div>

  <div class="pass-exhausted-overlay" th:if="${notEntered}" id="notEnteredModal">
    <div class="pass-exhausted-box">
      <i class="fa-solid fa-door-closed" aria-hidden="true"></i>
      <h2>입실을 먼저 해주세요</h2>
      <p>출석체크 기기에서 입실 후 다시 로그인해주세요.</p>
      <button type="button" id="notEnteredOk">확인</button>
    </div>
  </div>

  <div class="login-viewport">
    <form class="login-card" id="loginForm" th:action="@{/student/login}" method="post">
      <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
      <h1>학생 로그인</h1>
      <p>학생증 QR을 스캔하거나 앱 아이디를 입력해주세요</p>
      <p class="login-error" th:if="${error}" th:text="${error}">에러 메시지</p>
      <button type="button" class="qr-login-btn" id="qrLoginBtn">
        <i class="fa-solid fa-qrcode"></i> QR로 로그인
      </button>
      <p class="login-divider">또는</p>
      <input type="text" name="appId" placeholder="앱 아이디 (appId)" required />
      <button type="submit">입장하기</button>
    </form>
    <!-- 이 기기를 출석체크용으로 바꾸고 싶을 때. 다시 /launch로 보내 용도를 새로 고른다 -->
    <button type="button" class="change-mode-btn" id="changeModeBtn">기기 용도 변경</button>
  </div>
  <script th:src="@{/js/vendor/jsqr/jsQR.js}"></script>
  <script th:src="@{/js/student/qr-scan.js}"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.error('Service worker 등록 실패:', err);
        });
      });
    }

    const passExhaustedModal = document.getElementById('passExhaustedModal');
    if (passExhaustedModal) {
      document.getElementById('passExhaustedOk').addEventListener('click', () => passExhaustedModal.remove());
    }

    const noReservationModal = document.getElementById('noReservationModal');
    if (noReservationModal) {
      document.getElementById('noReservationOk').addEventListener('click', () => noReservationModal.remove());
    }

    const alreadyExitedModal = document.getElementById('alreadyExitedModal');
    if (alreadyExitedModal) {
      document.getElementById('alreadyExitedOk').addEventListener('click', () => alreadyExitedModal.remove());
    }

    const notEnteredModal = document.getElementById('notEnteredModal');
    if (notEnteredModal) {
      document.getElementById('notEnteredOk').addEventListener('click', () => notEnteredModal.remove());
    }

    // 이 기기 용도(문제풀이/출석체크)를 다시 고르고 싶을 때 — launcher.js가 쓰는 키와 같아야 한다
    document.getElementById('changeModeBtn').addEventListener('click', () => {
      try { localStorage.removeItem('hohobook.appMode'); } catch (err) { /* 저장소 접근 불가 시에도 이동은 진행 */ }
      window.location.href = '/launch';
    });

    document.getElementById('qrLoginBtn').addEventListener('click', async () => {
      try {
        const appId = await window.openQrScanner('QR로 로그인');
        const form = document.getElementById('loginForm');
        form.appId.value = appId;
        form.submit();
      } catch (err) {
        if (err.message !== 'cancelled') alert(err.message || 'QR 스캔에 실패했어요.');
      }
    });
  </script>
</body>

</html>
