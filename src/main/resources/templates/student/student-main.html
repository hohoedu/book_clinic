<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 학생 메인</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student/student-common.css}" />
  <link rel="stylesheet" th:href="@{/css/student/student-main.css}" />
  <link rel="stylesheet" th:href="@{/css/student/qr-scan.css}" />

</head>

<body>
  <div class="app-viewport">
    <main class="page" id="mainPage" th:attr="data-student-id=${studentId}">
      <header class="topbar">
        <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
        <div class="top-actions">
          <div class="student-pill" th:text="|${studentName} 학생|">김호호 학생</div>
          <button type="button" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"
              aria-hidden="true"></i>로그아웃</button>
        </div>
      </header>

      <section class="layout">
        <div class="book-slot">
          <!-- 추천 도서 로딩 -->
          <article class="card book-card state-card" id="recommendLoading">
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            <p>오늘의 추천 도서를 고르고 있어요...</p>
          </article> 

          <!-- 이용권 소진 — 결제/재계약이 필요한 상태(일반 에러와 톤을 구분) -->
          <article class="card book-card state-card state-card--warn" id="passExhausted" hidden>
            <i class="fa-solid fa-ticket" aria-hidden="true"></i>
            <p>이용권이 모두 소진되었어요.</p>
            <p class="state-card__sub">선생님께 말씀드리고 이용권을 다시 등록해주세요.</p>
          </article>

          <!-- 추천 도서 없음/에러 -->
          <article class="card book-card state-card" id="recommendEmpty" hidden>
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
            <p id="recommendEmptyMsg">추천할 수 있는 도서를 찾지 못했어요.</p>
          </article>

          <!-- 추천 도서 카드 (JS로 채움) -->
          <article class="card book-card" id="recommendCard" hidden>
            <div class="book-content">
              <div class="book-info">
                <div class="eyebrow">
                  <span class="star"><i class="fa-solid fa-star" aria-hidden="true"></i></span>오늘의 추천 도서
                  <!-- 완독(KING/FRIEND) 후 홈으로 왔을 때만 노출 — 다음 책을 새로 추천받는 버튼 -->
                  <button type="button" class="recommend-next-btn" id="recommendNextBtn" hidden>
                    <i class="fa-solid fa-rotate" aria-hidden="true"></i>책 추천받기</button>
                </div>
                <h1 class="book-title" id="bookTitle">-</h1>
                <p class="book-author" id="bookAuthor">-</p>
                <p class="book-desc" id="bookDesc"></p>

                <!-- 값이 없어도 행을 숨기지 않고 "-"로 채운다 — 책마다 메타 정보 개수가 달라도
                     정보 영역 높이와 각 항목 위치가 항상 같은 자리에 오도록 하기 위함 -->
                <dl class="book-meta" id="bookMeta">
                  <dt class="meta-label"><span class="ico"><i class="fa-solid fa-bookmark" aria-hidden="true"></i></span>분류</dt>
                  <dd class="meta-value green" id="bookMetaType">-</dd>
                  <dt class="meta-label"><span class="ico"><i class="fa-solid fa-award" aria-hidden="true"></i></span>수상정보</dt>
                  <dd class="meta-value" id="bookMetaAward">-</dd>
                  <dt class="meta-label"><span class="ico"><i class="fa-solid fa-square-check" aria-hidden="true"></i></span>수록</dt>
                  <dd class="meta-value" id="bookMetaCurriculum">-</dd>
                  <dd class="book-tags" id="bookMetaTags"></dd>
                </dl>
              </div>

              <div class="book-visual" aria-label="추천 도서 표지 영역">
                <span class="sparkle s1"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
                <span class="sparkle s2"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
                <span class="sparkle s3"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
                <div class="book-mockup">
                  <div class="book-cover">
                    <img class="main-book-img" id="bookImg" src="/images/book-sample.png" alt="추천 도서 표지" />
                    <span class="book-spine-line" aria-hidden="true"></span>
                  </div>
                  <div class="book-pages" aria-hidden="true"></div>
                  <div class="book-bottom-pages" aria-hidden="true"></div>
                </div>
                <div class="book-stand"></div>
              </div>
            </div>

            <button type="button" class="solve-btn" id="mainActionBtn">
              <span class="book-icon"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span>
              <span id="mainActionLabel">문제 풀기</span>
            </button>

            <!-- 완독(KING/FRIEND) 후 홈으로 왔을 때만 노출 — 문제 풀기 버튼 대신 남은 액션(틀린 문제
                 다시 풀기 / 심화 문제 풀기)만 보여준다. 둘 다 없을 수도 있다(둘 다 이미 끝낸 경우) -->
            <div class="completion-actions" id="completionActions" hidden>
              <button type="button" class="solve-btn solve-btn--sub" id="completionRetryBtn" hidden>
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>재도전</button>
              <button type="button" class="solve-btn solve-btn--sub" id="completionWrongRetryBtn" hidden>
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>틀린 문제 다시 풀기</button>
              <button type="button" class="solve-btn solve-btn--sub" id="completionAdvancedBtn" hidden>
                <i class="fa-solid fa-book-open" aria-hidden="true"></i>심화 문제 풀기</button>
            </div>
          </article>
        </div>

        <aside class="side">
          <section class="card level-card">
            <div class="level-head">
              <p class="section-title">나의 독서 레벨</p>
            </div>
            <div class="level-mascot">
              <img th:src="${characterImg ?: '/images/img-my-ch01.png'}" alt="레벨 캐릭터" />
            </div>
            <div class="level-name">
              <span class="level-pill" th:text="|Lv. ${levelNo}|">Lv. 3</span>
              <h3 th:text="${levelTitle}"></h3>
              <p class="level-stage" th:if="${levelName != null}" th:text="|${levelName} 단계|"></p>
            </div>
            <div class="level-progress">
              <div class="progress-label">다음 레벨까지</div>
              <div class="progress-count" th:text="|${booksToNextLevel ?: '-'}권|">2권</div>
              <div class="progress-track">
                <div class="progress-bar" th:style="|width:${progressPercent}%|"></div>
              </div>
            </div>
          </section>

          <!--
            카드 컬렉션 — 기존 "획득한 뱃지" 패널을 대체한다.
            카드 획득/보관 기능은 아직 미구현이라 컨트롤러가 cards 모델을 내려주지 않는다.
            지금은 빈 슬롯 4칸만 보이고, 나중에 cards(List<카드DTO>)를 채우면
            아래 th:each가 그대로 카드 4장을 렌더링한다.
          -->
          <section class="card panel">
            <div class="panel-head">
              <h3 class="panel-title">나의 카드 컬렉션</h3>
            </div>
            <div class="collect-cards">
              <div class="collect-card" th:each="card, st : ${cards}" th:if="${st.index < 4}">
                <img class="collect-card-img" th:src="@{/images/student_result/card.png}" alt="획득한 카드" />
              </div>
              <th:block th:with="cardCount=${cards != null ? cards.size() : 0}">
                <th:block th:if="${cardCount < 4}">
                  <div class="collect-card empty" th:each="i : ${#numbers.sequence(cardCount + 1, 4)}">
                    <i class="fa-regular fa-star" aria-hidden="true"></i>
                    <span>카드를<br />모아보세요!</span>
                  </div>
                </th:block>
              </th:block>
            </div>
          </section>

          <section class="card panel">
            <div class="panel-head">
              <div class="month-title-wrap">
                <h3 class="panel-title blue">이번 달에 읽은 책</h3>
                <div class="pager-dots" aria-label="페이지 표시">
                  <span class="dot" th:each="i : ${#numbers.sequence(1, 4)}"
                    th:classappend="${i <= monthBooks.size()} ? 'active'"></span>
                </div>
              </div>
              <a class="more-link" href="#">더보기 <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a>
            </div>
            <div class="month-books">
              <div class="month-book" th:each="book, st : ${monthBooks}" th:if="${st.index < 4}">
                <img th:src="${book.imageUrl ?: '/images/book-sample.png'}" th:alt="${book.originalTitle}" alt="도서 표지" />
                <span class="book-status" th:classappend="${book.status == 'DONE'} ? 'done' : 'reading'"
                  th:text="${book.status == 'DONE'} ? '완료' : '읽는 중'">읽는 중</span>
              </div>
              <th:block th:if="${monthBooks.size() < 4}">
                <div class="waiting-book" th:each="i : ${#numbers.sequence(monthBooks.size() + 1, 4)}">
                  <div class="outline-book"><i class="fa-regular fa-bookmark" aria-hidden="true"></i></div>
                  <div>다음 책이<br />기다리고 있어요!</div>
                </div>
              </th:block>
            </div>
          </section>
        </aside>
      </section>

      <!-- 로그아웃 확인 모달 -->
      <div class="modal-overlay" id="logoutConfirmModal" hidden>
        <div class="modal-box">
          <p class="modal-msg">정말로 로그아웃 하시겠습니까?</p>
          <div class="modal-actions">
            <button type="button" class="modal-btn modal-btn-no" id="logoutCancelBtn">아니요</button>
            <button type="button" class="modal-btn modal-btn-yes" id="logoutConfirmBtn">로그아웃</button>
          </div>
        </div>
      </div>

      <!-- "책 추천받기" 실패 안내 모달(하루 추천 한도 초과 등) -->
      <div class="modal-overlay" id="recommendErrorModal" hidden>
        <div class="modal-box">
          <p class="modal-msg" id="recommendErrorMsg">추천에 실패했어요.</p>
          <div class="modal-actions">
            <button type="button" class="modal-btn modal-btn-yes" id="recommendErrorOkBtn">확인</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script th:src="@{/js/vendor/jsqr/jsQR.js}"></script>
  <script th:src="@{/js/student/qr-scan.js}"></script>
  <script th:src="@{/js/student/student-main.js}"></script>
</body>

</html>
