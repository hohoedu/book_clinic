<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 출석체크 — 오늘의 추천 도서</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student/attendance-home.css}" />
  <link rel="stylesheet" th:href="@{/css/student/book-mockup.css}" />
  <link rel="stylesheet" th:href="@{/css/student/book-confirm.css}" />
</head>

<body>
  <div class="confirm-viewport">

    <!-- 학생을 못 찾은 경우(잘못된 QR 등) -->
    <div class="confirm-card error-card" th:if="${error}">
      <i class="fa-solid fa-circle-exclamation"></i>
      <p th:text="${error}"></p>
      <a class="confirm-close-btn" th:href="@{/attendance}">닫기</a>
    </div>

    <!-- 입실은 됐지만 지금 읽는 책이 없는 경우(2026-09-03) — 입실과 책 추천이 분리되면서 생긴
         화면이다. 여기서 바로 "책 추천받기"를 누르면 QR을 다시 스캔하지 않고 추천으로 넘어간다.
         심화 게이트에 걸리면 이 화면이 error-card로 다시 그려진다. -->
    <div class="confirm-card empty-card" th:if="${error == null and book == null}">
      <i class="fa-solid fa-circle-check"></i>
      <p th:text="|${studentName} 학생, 입실했어요!|">입실했어요!</p>
      <p class="empty-sub">읽을 책이 필요하면 아래 버튼을 눌러주세요.</p>
      <form method="post" th:action="@{/attendance/recommend}">
        <input type="hidden" name="appId" th:value="${appId}" />
        <button type="submit" class="confirm-close-btn confirm-recommend-btn">
          <i class="fa-solid fa-book" aria-hidden="true"></i> 책 추천받기
        </button>
      </form>
      <a class="confirm-close-btn confirm-ghost-btn" th:href="@{/attendance}">닫기</a>
    </div>

    <!-- 정상: 입실 처리 완료 + 오늘 읽을 책. 문제 풀기로는 이어지지 않는다 —
         공용 기기라 학습은 학생 개인 앱에서만 한다. -->
    <div class="confirm-stage" th:if="${error == null and book != null}">
      <p class="confirm-eyebrow">
        <span class="confirm-star"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
        오늘의 추천 도서
      </p>

      <!-- 책 제목은 대괄호로 감싸 한 문장 안에 넣는다 -->
      <h1 class="confirm-headline">
        <span class="confirm-headline-title"
          th:text="|[${book?.originalTitle ?: '오늘의 책'}]|">[치과의사 드소토 선생님]</span>
        책을 읽고 문제를 풀어보세요.
      </h1>

      <!-- 홈 화면과 같은 3D 책 목업(book-mockup.css 공유) -->
      <div class="book-visual confirm-visual" aria-label="추천 도서 표지 영역">
        <span class="sparkle s1"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
        <span class="sparkle s2"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
        <span class="sparkle s3"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
        <div class="book-mockup">
          <div class="book-cover">
            <img class="main-book-img" th:src="${book?.imageUrl ?: '/images/book-sample.png'}" alt="추천 도서 표지" />
            <span class="book-spine-line" aria-hidden="true"></span>
          </div>
          <div class="book-pages" aria-hidden="true"></div>
          <div class="book-bottom-pages" aria-hidden="true"></div>
        </div>
        <div class="book-stand"></div>
      </div>

      <a class="confirm-close-btn confirm-ok-btn" th:href="@{/attendance}">확인</a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW 등록 실패:', err));
      });
    }
  </script>
</body>

</html>
