<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 결과</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student/student-common.css}" />
  <link rel="stylesheet" th:href="@{/css/student/student-result.css}" />
</head>

<body>
  <div class="app-viewport">
    <main class="page" id="resultPage" th:data-student-id="${studentId}" th:data-content-id="${contentId}"
      th:data-qlevel="${qlevel}">
      <header class="topbar">
        <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
        <div class="top-actions">
          <div class="student-pill" th:text="|${studentName} 학생|">김호호 학생</div>
          <button type="button" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"
              aria-hidden="true"></i>로그아웃</button>
        </div>
      </header>

      <!-- 결과 패널(2026-09-28 시안 개편) — 한 장의 패널 안에 캐릭터 · 문제풀이 결과 · 획득 보상 2x2.
           예전의 별/트로피/재도전 횟수/신규 카드 칸/독서탐험 칸은 시안에서 빠졌다. -->
      <!-- is-loading — 결과를 받아 다 채울 때까지 점수·보상 칸을 숨긴다(2026-09-30). 예시 값(12/12 등)이
           잠깐 보였다가 바뀌는 깜빡임을 없애려고 아래 값들도 전부 비워 둔다. student-result.js init이 뗀다. -->
      <section class="card result-panel is-loading" id="resultPanel">
        <img class="ribbon-img card-ribbon" th:src="@{/images/student_result/purple.png}" alt="문제풀이 결과" />

        <div class="hero">
          <!-- 로티 에셋에 달성 문구(리본/텍스트)까지 그려져 있어 캐릭터 하나가 hero 전체를 차지한다
               (2026-09-14 캐릭터 로티 도입, 2026-09-17 헤드라인 제거) -->
          <!-- 로티 2겹(2026-09-28) — 폭죽(firework.json)을 뒤에, 캐릭터를 앞에 같은 크기로 겹친다.
               인트로 때 이 칸(heroCharacter)이 통째로 가운데로 나왔다 돌아가므로 두 로티가 함께 움직인다. -->
          <div class="hero-character" id="heroCharacter" data-grade="KING">
            <div class="hero-fireworks-anim" id="heroFireworksAnim" aria-hidden="true"></div>
            <div class="hero-character-anim" id="heroCharacterAnim"></div>
          </div>
        </div>

        <article class="score-card">
          <p class="score-label" id="scoreLabel"></p>
          <p class="score-num">
            <strong id="scoreCorrect"></strong><span class="score-total">/<span id="scoreTotal"></span></span>
          </p>
          <!-- 문항 번호 동그라미 — 맞힌 문항은 초록, 틀린 문항(wrongQnums)은 빨강. JS가 totalCount만큼 채운다 -->
          <ol class="score-dots" id="scoreDots" aria-label="문항별 결과"></ol>
          <div class="score-guide">
            <p class="score-guide-msg" id="resultTitle"></p>
            <p class="score-guide-next" id="resultNext" hidden>
              <em id="resultNextLabel"></em>를 진행해 주세요.</p>
          </div>
        </article>

        <!-- 획득한 보상 2x2 — 이번 결과에 해당하지 않는 칸은 숨긴다 -->
        <section class="reward-panel">
          <div class="reward-item">
            <p class="reward-title orange">경험치 획득!</p>
            <div class="reward-icon">
              <!-- 레벨 메달(medal_{레벨}.png)을 student-result.js 가 넣는다. 그 레벨 이미지가 아직 없으면
                   기본 금색 메달. 기본 메달을 src로 박아두면 레벨 메달로 바뀌며 깜빡여서 비워 둔다 (2026-09-30). -->
              <img id="rewardMedal" alt="레벨 메달" />
            </div>
            <div class="reward-progress">
              <div class="reward-progress-bar" id="rewardProgressBar"></div>
            </div>
            <p class="reward-desc" id="rewardExpDesc"></p>
          </div>

          <!-- 이번 제출로 도서 카드를 새로 받은 경우에만 노출 — 이미지는 서버가 내려준 cardImageUrl
               (erp_bookstore_card_path.card_url, 미등록 책은 기본 카드로 폴백된 값) -->
          <div class="reward-item" id="newCard" hidden>
            <p class="reward-title pink">도서 카드 획득!</p>
            <div class="reward-icon">
              <img class="reward-card-img" id="newCardImg" th:src="@{/images/student_result/card.png}" alt="새로 획득한 카드" />
            </div>
            <p class="reward-desc">컬렉션에 추가됐어요!</p>
          </div>

          <!-- 뱃지 스티커 — 이번 제출로 받은 뱃지(없으면 그 책에서 보유 중인 뱃지) -->
          <div class="reward-item" id="badgeReward" hidden>
            <p class="reward-title blue">뱃지 스티커 획득!</p>
            <div class="reward-icon">
              <img id="rewardBadgeImg" th:src="@{/images/student_result/passport.png}" alt="획득한 뱃지" />
            </div>
            <p class="reward-desc"><strong id="rewardBadgeName"></strong> 스티커를 획득했어요!</p>
          </div>

          <!-- 숨겨진 보물 — 완독 카드 10장을 채운 순간(스페셜 카드 지급)에만 노출 -->
          <div class="reward-item" id="cardReward" hidden>
            <p class="reward-title violet">숨겨진 보물 발견!</p>
            <div class="reward-icon">
              <img class="reward-card-img" id="specialCardImg" th:src="@{/images/student_result/treasure.png}" alt="스페셜 카드" />
            </div>
            <p class="reward-desc">선생님께 카드를 받아요!</p>
          </div>

          <!-- 스페셜 카드를 못 받았을 때 그 자리 — 10장 세트까지 남은 권수(칸)를 보여준다 -->
          <div class="reward-item" id="treasureProgress" hidden>
            <p class="reward-title violet">보물 발견까지 <span class="js-treasure-left"></span>칸!</p>
            <div class="reward-icon">
              <img id="mysteryCardImg" th:src="@{/images/student_result/mystery_card.png}" alt="아직 발견하지 못한 보물 카드" />
            </div>
            <p class="reward-desc">보물 발견까지 <span class="js-treasure-left"></span>칸 남았어요!</p>
          </div>
        </section>
      </section>

      <div class="result-actions">
        <a class="btn-home" th:href="@{/student/main(studentId=${studentId})}">홈으로</a>
        <div class="result-actions-right">
          <a class="btn-retry" id="wrongRetryBtn" hidden
            th:href="@{/student/question(studentId=${studentId},contentId=${contentId},qlevel='01')}">
            틀린 문제 다시 풀기</a>
          <a class="btn-advanced" id="advancedBtn" hidden
            th:href="@{/student/question(studentId=${studentId},contentId=${contentId},qlevel='02')}">
            <i class="fa-solid fa-book-open" aria-hidden="true"></i>문해력 문제 풀기</a>
          <!-- 아래 둘은 라벨만 다른 로그아웃 버튼이다(2026-09-03) — 학생이 앱에서 나가 실제로
               책을 읽거나 종이 여권을 쓰러 가는 행동이라 이동할 화면이 따로 없다.
               button인 이유: href로 페이지를 이동시키면 로그아웃 요청이 끝나기 전에 화면이 바뀐다. -->
          <button type="button" class="btn-read-again" id="readAgainBtn" hidden>
            <i class="fa-solid fa-book-open-reader" aria-hidden="true"></i>다시 읽으러 가기</button>
          <button type="button" class="btn-passport" id="passportBtn" hidden>
            <i class="fa-solid fa-passport" aria-hidden="true"></i>여권 작성하기</button>
        </div>
      </div>

      <!-- 카드 획득 연출(2026-09-28) — 도서 카드 → 스페셜 카드 순서로 한 장씩 띄우고, 화면을 누르면 닫힌다.
           후광이 돌고 카드가 세로축으로 빙글빙글 돈다. 문구/이미지는 JS가 장마다 채운다. -->
      <div class="card-reveal" id="cardReveal" hidden aria-live="polite">
        <p class="card-reveal-title" id="cardRevealTitle">도서 카드 획득!</p>
        <p class="card-reveal-desc" id="cardRevealDesc">컬렉션에 추가됐어요!</p>
        <div class="card-reveal-stage">
          <div class="card-reveal-rays" aria-hidden="true"></div>
          <div class="card-reveal-card" id="cardRevealCard">
            <img class="card-reveal-face" id="cardRevealFront" alt="" />
            <img class="card-reveal-face card-reveal-back" id="cardRevealBack" alt="" aria-hidden="true" />
          </div>
        </div>
      </div>

    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script th:src="@{/js/student/student-main.js}"></script>
  <script th:src="@{/js/student/student-result.js}"></script>
</body>

</html>
