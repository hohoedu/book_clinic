<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>호호책방 결과</title>
  <link rel="manifest" th:href="@{/manifest.json}" />
  <meta name="theme-color" content="#0988d8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="icon" th:href="@{/images/icons/icon-192.png}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/student/student-common.css}" />
  <link rel="stylesheet" th:href="@{/css/student/student-result.css}" />
</head>

<body>
  <div class="app-viewport">
    <main class="page" id="resultPage" th:data-student-id="${studentId}" th:data-content-id="${contentId}"
      th:data-qlevel="${qlevel}">
      <header class="topbar">
        <img class="logo" th:src="@{/images/logo_chaekbang.png}" alt="호호책방 로고" />
        <div class="top-actions">
          <div class="student-pill" th:text="|${studentName} 학생|">김호호 학생</div>
          <button type="button" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"
              aria-hidden="true"></i>로그아웃</button>
        </div>
      </header>

      <!-- 상단 3단: 캐릭터/타이틀 · 문제풀이 결과 카드 · 신규 카드 -->
      <section class="result-top">
        <div class="hero">
          <!-- 리본은 글자까지 그려진 이미지 한 장. 재도전 등급은 "정말 잘했어요!"가 맞지 않아
               같은 자리에 텍스트 리본(#heroRibbonText)으로 대체한다 -->
          <img class="ribbon-img" id="heroRibbon" th:src="@{/images/student_result/green.png}" alt="정말 잘했어요!" />
          <span class="ribbon ribbon-green" id="heroRibbonText" hidden>조금만 더!</span>
          <!-- 달성 문구 이미지는 독서왕(ment.png)만 있어서, 나머지 등급은 같은 자리에
               텍스트 제목(#heroHeadlineText)으로 대체한다 (JS setHero) -->
          <div class="hero-headline">
            <img id="heroHeadline" data-grade="KING" th:src="@{/images/student_result/ment.png}" alt="독서왕 달성!" />
            <h1 class="hero-headline-text" id="heroHeadlineText" hidden>달성!</h1>
          </div>
          <!-- 캐릭터는 아직 등급 구분 없이 한 종류(kidoc.png)만 있다 -->
          <div class="hero-character" id="heroCharacter" data-grade="KING">
            <img th:src="@{/images/student_result/kidoc.png}" alt="호호책방 캐릭터" />
          </div>
        </div>

        <article class="card score-card">
          <img class="ribbon-img card-ribbon" th:src="@{/images/student_result/purple.png}" alt="문제풀이 결과" />

          <div class="score-main">
            <p class="score-num">
              <strong id="scoreCorrect">12</strong>
              <span class="score-slash">/</span>
              <span class="score-total" id="scoreTotal">12</span>
            </p>
            <!-- 별 5개는 각각 이미지로 들어간다 — 정답률만큼 JS가 is-on을 붙이고,
                 CSS 변수(--star-on/--star-off)에 이미지 경로만 넣으면 켜짐/꺼짐이 교체된다 -->
            <div class="score-stars" id="scoreStars" aria-hidden="true">
              <span class="star"></span>
              <span class="star"></span>
              <span class="star"></span>
              <span class="star"></span>
              <span class="star"></span>
            </div>
            <div class="score-trophy">
              <img th:src="@{/images/student_result/trophy.png}" alt="트로피" />
            </div>
          </div>

          <div class="score-notes">
            <p class="score-note" id="resultTitle">문제를 다 풀었어요!</p>
            <div class="score-retry">
              <span>재도전 여부</span>
              <strong id="resultRetryText">없음</strong>
            </div>
          </div>
        </article>

        <div class="new-card">
          <div class="new-card-frame">
            <img class="new-flag" th:src="@{/images/student_result/new.png}" alt="NEW" />
            <!-- 카드 컬렉션 기능 구현 전이라 획득 카드는 샘플 이미지(card.png) 고정 -->
            <div class="new-card-slot">
              <img th:src="@{/images/student_result/card.png}" alt="새로 획득한 카드" />
            </div>
          </div>
          <p class="new-card-caption">신규 카드를 획득했어요!</p>
        </div>
      </section>

      <!-- 획득한 보상 4종 — 카드/도장/탐험 데이터는 아직 미구현이라 자리와 문구만 잡아둔다 -->
      <section class="card reward-panel">
        <img class="ribbon-img card-ribbon" th:src="@{/images/student_result/yellow.png}" alt="획득한 보상" />
        <div class="reward-list">
          <div class="reward-item">
            <div class="reward-icon">
              <img th:src="@{/images/student_result/medal.png}" alt="레벨 메달" />
            </div>
            <div class="reward-body">
              <p class="reward-title orange">레벨 성장!</p>
              <p class="reward-value"><span class="reward-lv" id="rewardLevelNo">Lv. 2</span> <span
                  id="rewardLevelName">독서 새싹</span></p>
              <div class="reward-progress">
                <div class="reward-progress-bar" id="rewardProgressBar"></div>
              </div>
              <p class="reward-desc" id="rewardExpDesc">다음 레벨까지 2권 남았어요!</p>
            </div>
          </div>

          <div class="reward-item" id="cardReward" hidden>
            <div class="reward-icon">
              <img class="rare-flag" th:src="@{/images/student_result/rare.png}" alt="RARE" />
              <img class="reward-card-img" id="rewardCardImg" th:src="@{/images/student_result/treasure.png}" alt="획득한 카드" />
            </div>
            <div class="reward-body">
              <p class="reward-title pink">카드 획득!</p>
              <p class="reward-value" id="rewardCardName">별빛 랜턴</p>
              <p class="reward-desc" id="rewardCardDesc">이 책의 카드를 모았어요.</p>
            </div>
          </div>

          <div class="reward-item">
            <div class="reward-icon">
              <img th:src="@{/images/student_result/passport.png}" alt="독서여권" />
            </div>
            <div class="reward-body">
              <p class="reward-title blue">독서여권 도장!</p>
              <p class="reward-value" id="rewardStampCount">1개 획득!</p>
              <p class="reward-desc">읽은 책을 여권에 기록해 주세요.</p>
            </div>
          </div>

          <div class="reward-item">
            <div class="reward-icon">
              <img th:src="@{/images/student_result/map.png}" alt="독서탐험 지도" />
            </div>
            <div class="reward-body">
              <p class="reward-title blue">독서탐험 한칸 더!</p>
              <p class="reward-value"><strong id="rewardStepNow">35</strong> <span class="reward-step-total">/ <span
                    id="rewardStepTotal">96</span>칸</span></p>
              <p class="reward-desc">독서탐험이 한 단계 성장했어요!</p>
            </div>
          </div>
        </div>
      </section>

      <div class="result-actions">
        <a class="btn-home" th:href="@{/student/main(studentId=${studentId})}">홈으로</a>
        <div class="result-actions-right">
          <a class="btn-retry" id="retryBtn" hidden
            th:href="@{/student/question(studentId=${studentId},contentId=${contentId},qlevel='01')}">
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>다시 풀기</a>
          <a class="btn-retry" id="wrongRetryBtn" hidden
            th:href="@{/student/question(studentId=${studentId},contentId=${contentId},qlevel='01')}">
            틀린 문제 다시 풀기</a>
          <a class="btn-advanced" id="advancedBtn" hidden
            th:href="@{/student/question(studentId=${studentId},contentId=${contentId},qlevel='02')}">
            <i class="fa-solid fa-book-open" aria-hidden="true"></i>심화 문제 풀기</a>
        </div>
      </div>
    </main>
  </div>
  <script th:src="@{/js/student/student-main.js}"></script>
  <script th:src="@{/js/student/student-result.js}"></script>
</body>

</html>
