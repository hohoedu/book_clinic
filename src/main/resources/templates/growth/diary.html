<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>독서일지</title>

  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  <link rel="stylesheet" th:href="@{/css/growth/diary.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script th:src="@{/js/common.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
</head>

<body>

  <div class="admin-layout">

    <div id="sidebarArea" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="content diary-content">

      <header class="page-header">
        <h1>독서일지</h1>
        <div class="page-header-actions">
          <a class="guide-btn" th:href="@{/sso/to-all-pass(redirectUrl='/class/record')}">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            수업일지 바로가기
          </a>
          <button class="guide-btn">
            <i class="fa-regular fa-circle-question"></i>
            사용 가이드
          </button>
        </div>
      </header>

      <section class="diary-toolbar">
        <div class="monitor-date-picker">
          <span class="monitor-date-display" id="diaryDateDisplay">2026. 07. 14</span>
          <div class="monitor-date-trigger">
            <i class="fa-regular fa-calendar"></i>
            <input type="date" id="diaryDate" value="2026-07-14" />
          </div>
        </div>

        <!-- 회차 마스터 데이터가 없다 — 센터마다 회차 수가 달라 고정 목록을 둘 수 없으므로
             (2026-08-18), diary.js가 그날 조회된 행에서 실제 회차 값을 뽑아 옵션을 채운다
             (refreshSlotOptions) -->
        <label class="diary-slot-picker">
          <span>회차 선택</span>
          <select id="diarySlot"></select>
        </label>

        <div class="diary-search-box">
          <input type="text" id="diaryStudentKeyword" placeholder="학생명" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <button type="button" class="btn primary" id="btnSearchDiary">조회</button>

        <label class="diary-my-student-toggle">
          <input type="checkbox" id="myStudentOnly" />
          내 담당 학생만 보기
        </label>

        <button type="button" class="btn primary diary-save-btn" id="btnSaveAllDiaries">저장</button>
      </section>

      <section class="diary-list" id="diaryList">

      </section>

    </main>

  </div>

  <script th:src="@{/js/growth/diary.js}"></script>
</body>

</html>
