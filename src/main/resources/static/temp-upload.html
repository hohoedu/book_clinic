<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>문제 일괄 등록</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6fb; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 40px 44px; width: 520px; }
    h2 { font-size: 20px; color: #222; margin: 0 0 6px; }
    .subtitle { font-size: 13px; color: #999; margin: 0 0 32px; }

    /* 스텝 바 */
    .steps { display: flex; align-items: center; margin-bottom: 32px; }
    .step { display: flex; align-items: center; gap: 8px; }
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: #e3eaf8; color: #4a90d9; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-text { font-size: 13px; color: #aaa; white-space: nowrap; }
    .step-line { flex: 1; height: 1px; background: #ddd; margin: 0 8px; }

    /* 섹션 */
    .section { border: 1px solid #e8edf5; border-radius: 8px; padding: 20px 22px; margin-bottom: 14px; }
    .section-title { font-size: 12px; font-weight: bold; color: #4a90d9; margin-bottom: 12px; letter-spacing: .5px; }
    .section-desc { font-size: 13px; color: #666; margin-bottom: 12px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
    input[type="file"] { width: 100%; padding: 8px 10px; border: 1px dashed #c0cce0; border-radius: 6px; font-size: 13px; color: #555; background: #f9fbff; cursor: pointer; }

    /* 버튼 */
    .btn-row { display: flex; gap: 10px; }
    .btn { padding: 10px 22px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; font-weight: bold; }
    .btn-primary { background: #4a90d9; color: #fff; }
    .btn-primary:hover { background: #3578c4; }
    .btn-outline { background: #fff; color: #4a90d9; border: 1.5px solid #4a90d9; text-decoration: none; display: inline-flex; align-items: center; }
    .btn-outline:hover { background: #eaf3ff; }
    .btn-danger  { background: #e53935; color: #fff; }
    .btn-danger:hover  { background: #c62828; }
    .btn-secondary { background: #fff; color: #555; border: 1.5px solid #ccc; }
    .btn-secondary:hover { background: #f5f5f5; }

    /* 결과 */
    #result { margin-top: 16px; padding: 13px 16px; border-radius: 6px; font-size: 14px; display: none; line-height: 1.7; }
    .success { background: #e6f4ea; border: 1px solid #81c784; color: #2e7d32; }
    .error   { background: #fdecea; border: 1px solid #e57373; color: #c62828; }

    /* 로딩 */
    #loading { display: none; margin-top: 16px; }
    .progress-bar-wrap { background: #e3eaf8; border-radius: 999px; height: 10px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: #4a90d9; border-radius: 999px; transition: width 0.2s ease; }
    .progress-bar.indeterminate { animation: indeterminate 1.4s infinite ease-in-out; width: auto; }
    @keyframes indeterminate {
      0%   { margin-left: 0;    width: 0; }
      50%  { margin-left: 15%;  width: 70%; }
      100% { margin-left: 100%; width: 0; }
    }
    .loading-text { font-size: 13px; color: #4a90d9; margin-top: 8px; text-align: center; }

    /* 모달 */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 28px 32px; width: 440px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
    .modal h3 { font-size: 16px; color: #222; margin: 0 0 6px; }
    .modal .modal-sub { font-size: 13px; color: #888; margin: 0 0 16px; }
    .dup-list { max-height: 180px; overflow-y: auto; border: 1px solid #e8edf5; border-radius: 6px; padding: 8px 12px; margin-bottom: 20px; }
    .dup-item { font-size: 13px; color: #444; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .dup-item:last-child { border-bottom: none; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  </style>
</head>
<body>
<div class="card">
  <h2>문제 일괄 등록</h2>
  <p class="subtitle">엑셀 양식을 다운로드하여 작성 후 업로드하면 한 번에 등록됩니다.</p>

  <div class="steps">
    <div class="step"><div class="step-num">1</div><div class="step-text">양식 다운로드</div></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-num">2</div><div class="step-text">도서 선택 · 문제 작성</div></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-num">3</div><div class="step-text">파일 업로드</div></div>
  </div>

  <!-- STEP 1 -->
  <div class="section">
    <div class="section-title">STEP 1 &nbsp;·&nbsp; 엑셀 양식 다운로드</div>
    <div class="section-desc">양식 안의 <strong>A열 드롭다운</strong>에서 도서를 선택하고,<br>2행부터 문제를 입력하세요.</div>
    <div class="btn-row">
      <a class="btn btn-outline" href="/question/upload/template" download>📥 엑셀 양식 다운로드</a>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="section">
    <div class="section-title">STEP 3 &nbsp;·&nbsp; 작성한 파일 업로드</div>
    <label for="fileInput">.xlsx 파일 선택</label>
    <input type="file" id="fileInput" accept=".xlsx" style="margin-bottom:12px;">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="upload('check')">업로드</button>
    </div>
  </div>

  <div id="loading">
    <div class="progress-bar-wrap"><div class="progress-bar"></div></div>
    <div class="loading-text">업로드 중입니다...</div>
  </div>
  <div id="result"></div>
</div>

<!-- 중복 확인 모달 -->
<div class="modal-backdrop" id="dupModal">
  <div class="modal">
    <h3>이미 등록된 문제가 있습니다</h3>
    <p class="modal-sub">아래 문제가 이미 존재합니다. 어떻게 처리할까요?</p>
    <div class="dup-list" id="dupList"></div>
    <div class="modal-actions">
      <button class="btn btn-danger"    onclick="upload('overwrite')">예 (기존 내용 덮어쓰기)</button>
      <button class="btn btn-secondary" onclick="upload('skip')">아니오 (중복 건너뛰기)</button>
      <button class="btn btn-secondary" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>

<script>
  const loadingEl  = document.getElementById('loading');
  const progressEl = loadingEl.querySelector('.progress-bar');
  const loadingTxt = loadingEl.querySelector('.loading-text');
  const resultEl   = document.getElementById('result');

  function upload(mode) {
    const file = document.getElementById('fileInput').files[0];
    if (!file) { show(resultEl, '파일을 선택해주세요.', false); return; }
    if (!file.name.endsWith('.xlsx')) { show(resultEl, '.xlsx 형식의 파일만 업로드할 수 있습니다.', false); return; }

    closeModal();
    resultEl.style.display = 'none';
    setProgress(0, '업로드 준비 중...');

    const formData = new FormData();
    formData.append('file', file);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/question/upload?mode=' + mode);

    // 실제 파일 전송 진행률
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round(e.loaded / e.total * 100);
        setProgress(pct, `업로드 중... ${pct}%`);
      }
    };

    // 전송 완료 후 서버 처리 중
    xhr.upload.onload = () => setIndeterminate('서버 처리 중...');

    xhr.onload = () => {
      hideLoading();
      try {
        const json = JSON.parse(xhr.responseText);
        if (xhr.status === 409 && json.response?.duplicates?.length) {
          showDupModal(json.response.duplicates);
          return;
        }
        if (xhr.status === 200 && json.success) {
          const r = json.response;
          show(resultEl,
            `✔ ${r.total}건 등록 &nbsp;|&nbsp; 활성 ${r.activeCount}건 / 비활성 ${r.inactiveCount}건`,
            true);
        } else {
          show(resultEl, '✘ ' + (json.error?.message ?? '서버 오류가 발생했습니다.'), false);
        }
      } catch (e) {
        show(resultEl, '✘ 응답 파싱 오류: ' + e.message, false);
      }
    };

    xhr.onerror = () => { hideLoading(); show(resultEl, '✘ 요청 실패', false); };

    xhr.send(formData);
  }

  function setProgress(pct, text) {
    loadingEl.style.display = 'block';
    progressEl.classList.remove('indeterminate');
    progressEl.style.width = pct + '%';
    loadingTxt.textContent = text;
  }

  function setIndeterminate(text) {
    progressEl.classList.add('indeterminate');
    loadingTxt.textContent = text;
  }

  function hideLoading() {
    loadingEl.style.display = 'none';
    progressEl.classList.remove('indeterminate');
    progressEl.style.width = '0';
  }

  function showDupModal(duplicates) {
    const list = document.getElementById('dupList');
    list.innerHTML = duplicates
      .map(d => `<div class="dup-item">📖 ${d.bookTitle} &nbsp;—&nbsp; ${d.qnum}번 문제</div>`)
      .join('');
    document.getElementById('dupModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('dupModal').classList.remove('open');
  }

  function show(el, msg, ok) {
    el.innerHTML     = msg;
    el.className     = ok ? 'success' : 'error';
    el.style.display = 'block';
  }
</script>
</body>
</html>
